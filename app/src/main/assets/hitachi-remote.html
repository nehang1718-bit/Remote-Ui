<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitachi AC Remote</title>
<style>
:root{
  --text:#f4efe6;--sub:rgba(244,239,230,.6);--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.55);
  --a:#9ddbd6;--b:#3f6f9e;--bg:#06080d;--ink:#0a0d12;--px:0px;--py:0px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--text:#10213a;--sub:rgba(16,33,58,.6);--glass:rgba(255,255,255,.45);--edge:rgba(255,255,255,.8);--shadow:rgba(40,60,100,.25);--bg:#dfe9fb}
}
:root[data-theme="light"]{--text:#10213a;--sub:rgba(16,33,58,.6);--glass:rgba(255,255,255,.45);--edge:rgba(255,255,255,.8);--shadow:rgba(40,60,100,.25);--bg:#dfe9fb}
:root[data-theme="dark"]{--text:#f4efe6;--bg:#06080d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow-x:hidden;transition:background .6s}
body[data-mode=cool]{--a:#9ddbd6;--b:#3f6f9e}
body[data-mode=heat]{--a:#e9b384;--b:#b5524f}
body[data-mode=dry]{--a:#a8cfb4;--b:#3f7f80}
body[data-mode=fan]{--a:#c3b4f0;--b:#6a58b8}
body[data-mode=auto]{--a:#e8d6a8;--b:#a98652}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--text:#2a2620;--sub:rgba(42,38,32,.6);--bg:#ebe5da;--shadow:rgba(80,60,30,.25);--glass:rgba(255,255,255,.5);--edge:rgba(255,255,255,.85)}}
:root[data-theme="light"]{--text:#2a2620;--sub:rgba(42,38,32,.6);--bg:#ebe5da;--shadow:rgba(80,60,30,.25);--glass:rgba(255,255,255,.5);--edge:rgba(255,255,255,.85)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
html body .blob{opacity:.42}html body.off .blob{opacity:.1}
.b1{translate:calc(var(--px)*-1) calc(var(--py)*-1);transition:translate .4s ease-out}
.b2{translate:var(--px) var(--py);transition:translate .4s ease-out}
.glass{position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.13),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 72%,var(--a));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 7s linear infinite}
@keyframes ang{to{--ang:360deg}}
.stage>section,header{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
header{animation-delay:.05s}.stage>section:nth-child(1){animation-delay:.15s}.stage>section:nth-child(2){animation-delay:.28s}.stage>section:nth-child(3){animation-delay:.41s}.stage>section:nth-child(4){animation-delay:.54s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(8px)}}
.glass.flash{animation:flash .9s ease-out}
@keyframes flash{30%{box-shadow:0 0 44px var(--a),0 12px 36px var(--shadow)}}
.temp b{text-shadow:0 0 34px var(--a)}
body:not(.off) button.pwr{color:var(--ink);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 42px var(--a),0 0 0 8px rgba(255,255,255,.06)}}
body .chip.on,body .seg button.on{color:var(--ink)}
.chip,.pwr,.seg button{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.chip.on[data-m=cool] svg{animation:spin 8s linear infinite}
.chip.on[data-m=heat] svg{animation:spin 10s linear infinite}
.chip.on[data-m=dry] svg{animation:bob 1.8s ease-in-out infinite}
.chip.on[data-m=fan] svg{animation:spin 2s linear infinite}
.chip.on[data-m=auto] svg{animation:twink 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
@keyframes twink{50%{transform:scale(1.25) rotate(15deg)}}
input[type=range]::-webkit-slider-thumb{animation:halo 2.6s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 10px rgba(255,255,255,.12)}}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .8s}
body.off #fx{opacity:0}
.pt{position:absolute;top:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--a);opacity:0;animation:fall var(--d) linear var(--dl) infinite}
body[data-mode=heat] .pt{top:auto;bottom:-12px;animation-name:rise2}
body[data-mode=dry] .pt{animation-name:fall;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
body[data-mode=fan] .pt{top:var(--y);left:-12px;animation-name:drift}
body[data-mode=auto] .pt{top:var(--y);animation-name:twk;animation-duration:calc(var(--d)/3)}
@keyframes fall{10%{opacity:.7}100%{transform:translate(30px,105vh);opacity:0}}
@keyframes rise2{10%{opacity:.7}100%{transform:translate(-24px,-105vh);opacity:0}}
@keyframes drift{10%{opacity:.6}100%{transform:translateX(110vw);opacity:0}}
@keyframes twk{50%{opacity:.9;transform:scale(1.8)}}
.hr{display:flex;align-items:center;gap:10px}
.thm{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--text);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .5s,transform .2s}
.thm:active{transform:scale(.88)}
.thm svg{position:absolute;left:9px;top:9px;width:20px;height:20px;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.thm .sun{opacity:0;transform:rotate(-90deg) scale(.3)}
:root[data-theme=light] .thm .moon{opacity:0;transform:rotate(90deg) scale(.3)}
:root[data-theme=light] .thm .sun{opacity:1;transform:none}
.glass{transition:background .5s,border-color .5s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;transition:background 1s,opacity .6s;z-index:0}
.b1{width:300px;height:300px;top:-60px;left:-80px;background:var(--a);animation:drift 14s ease-in-out infinite alternate}
.b2{width:340px;height:340px;bottom:-100px;right:-100px;background:var(--b);animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(50px,60px) scale(1.15)}}
body.off .blob{opacity:.18}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:28px;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 12px 36px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);padding:18px}
header{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:15px;font-weight:600;letter-spacing:.14em;margin:0;text-transform:uppercase}
header small{display:block;color:var(--sub);font-size:12px;letter-spacing:0;text-transform:none;margin-top:2px;font-weight:400}
.pwr{width:48px;height:48px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.4s;backdrop-filter:blur(12px)}
.pwr svg{width:22px;height:22px}
body:not(.off) .pwr{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 0 24px var(--a)}
.pwr:active{transform:scale(.9)}
.stage{transition:opacity .5s,filter .5s,transform .5s}
body.off .stage{opacity:.4;filter:saturate(.2);pointer-events:none;transform:scale(.985)}
.top{display:flex;align-items:center;justify-content:space-between}
.temp{font-size:84px;font-weight:200;line-height:1;letter-spacing:-.04em;display:flex;align-items:flex-start}
.temp span{font-size:26px;margin-top:10px;color:var(--sub);font-weight:400}
.temp b{font-weight:200;display:inline-block;transition:transform .25s}
.temp b.bump{transform:translateY(-4px) scale(1.05)}
.status{text-align:right;color:var(--sub);font-size:13px;line-height:1.6}
.status strong{color:var(--text);font-weight:600;display:block;font-size:16px;text-transform:capitalize}
.sl{margin-top:22px}
.sl .lbl{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-bottom:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:46px;background:transparent;margin:0;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:46px;border-radius:23px;border:1px solid var(--edge);background:linear-gradient(90deg,var(--a),var(--b)) 0/var(--p,50%) 100% no-repeat,rgba(255,255,255,.1);box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:46px;border-radius:23px;border:1px solid var(--edge);background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:46px;border-radius:23px;background:linear-gradient(90deg,var(--a),var(--b))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:3px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 6px rgba(255,255,255,.25);transition:box-shadow .2s}
input[type=range]::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.4)}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 12px rgba(255,255,255,.3)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:18px;padding:12px 0 9px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.35s;font-family:inherit}
.chip svg{width:22px;height:22px}
.chip.on{background:linear-gradient(160deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 20px var(--a);transform:translateY(-2px)}
.chip:active{transform:scale(.93)}
.fanrow{display:flex;align-items:center;gap:18px}
.fanbox{position:relative;width:118px;height:118px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.fan{width:96px;height:96px;color:var(--a);filter:drop-shadow(0 0 10px var(--a));transform-origin:center}
.fan path{fill:currentColor;opacity:.9}
.fan circle{fill:#fff}
.fan.s0{animation:spin 6s linear infinite}
.fan.s1{animation:spin 2.6s linear infinite}
.fan.s2{animation:spin 1.1s linear infinite}
.fan.s3{animation:spin .4s linear infinite;filter:drop-shadow(0 0 16px var(--a)) blur(.6px)}
.fan.auto{animation:spin 3s linear infinite,surge 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes surge{50%{animation-timing-function:ease-in;filter:drop-shadow(0 0 18px var(--a)) blur(.8px)}}
.fan.auto{animation:spin 3s linear infinite,surge 5s ease-in-out infinite}
body.off .fan{animation-play-state:paused}
.wind{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:50%}
.wind i{position:absolute;left:-30%;height:2px;width:40%;border-radius:2px;background:linear-gradient(90deg,transparent,var(--text));opacity:0;animation:blow 1.6s linear infinite}
.wind i:nth-child(1){top:30%;animation-delay:0s}.wind i:nth-child(2){top:50%;animation-delay:.4s}.wind i:nth-child(3){top:70%;animation-delay:.8s}
.wind i:nth-child(n+4){display:none}
.wind.l1 i{animation-duration:2.4s}.wind.l2 i{animation-duration:1.5s}.wind.l3 i{animation-duration:.8s}
.wind.l1 i:nth-child(3),.wind.l1 i:nth-child(2){display:none}
.wind.l2 i:nth-child(3){display:none}
@keyframes blow{0%{transform:translateX(0);opacity:0}20%{opacity:.7}100%{transform:translateX(420%);opacity:0}}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:16px;padding:12px 0;font-size:13px;font-family:inherit;cursor:pointer;transition:.35s;position:relative;overflow:hidden}
.seg button.on{background:linear-gradient(160deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 18px var(--a)}
.seg button:active{transform:scale(.94)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row .t{font-size:15px;font-weight:500}.row .d{font-size:12px;color:var(--sub);margin-top:2px}
.vane{width:54px;height:30px;position:relative}
.vane i{position:absolute;left:4px;top:12px;width:46px;height:5px;border-radius:3px;background:var(--text);transform-origin:left center;transform:rotate(15deg);transition:transform .5s}
.vane.sw i{animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(38deg)}}
.tog{width:56px;height:32px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.4s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.tog.on{background:linear-gradient(90deg,var(--a),var(--b))}
.tog.on::after{transform:translateX(24px)}
.foot{text-align:center;color:var(--sub);font-size:11px;min-height:16px;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.blob,.fan,.wind i,.vane i{animation:none!important}}
</style>
</head>
<body data-mode="cool">
<div class="blob b1"></div><div class="blob b2"></div>
<main>
  <header>
    <h1>Hitachi<small id="room">Living room · AC</small></h1>
    <div class="hr"><button class="thm" id="thm" aria-label="Toggle dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button><button class="pwr" id="pwr" aria-label="Power"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button></div>
  </header>

  <div class="stage" style="display:flex;flex-direction:column;gap:14px">
    <section class="glass hero">
      <div class="top">
        <div class="temp"><b id="tv">24</b><span>°C</span></div>
        <div class="status"><strong id="modeName">Cool</strong><span id="fanName">Fan auto</span></div>
      </div>
      <div class="sl">
        <div class="lbl"><span>16°</span><span>Temperature</span><span>32°</span></div>
        <input type="range" id="temp" min="16" max="32" step="1" value="24" aria-label="Temperature">
      </div>
    </section>

    <section class="glass">
      <div class="chips" id="modes"></div>
    </section>

    <section class="glass">
      <div class="fanrow">
        <div class="fanbox">
          <div class="wind l0" id="wind"><i></i><i></i><i></i></div>
          <svg class="fan auto" id="fan" viewBox="0 0 100 100"><path d="M50 50C50 20 62 8 74 14C84 20 76 40 50 50Z"/><path d="M50 50C50 20 62 8 74 14C84 20 76 40 50 50Z" transform="rotate(120 50 50)"/><path d="M50 50C50 20 62 8 74 14C84 20 76 40 50 50Z" transform="rotate(240 50 50)"/><circle cx="50" cy="50" r="7"/></svg>
        </div>
        <div class="seg" id="fans"></div>
      </div>
    </section>

    <section class="glass">
      <div class="row">
        <div style="display:flex;align-items:center;gap:14px">
          <div class="vane" id="vane"><i></i></div>
          <div><div class="t">Swing</div><div class="d" id="swd">Louver fixed</div></div>
        </div>
        <div class="tog" id="swing" role="switch" aria-checked="false"></div>
      </div>
    </section>
  </div>
  <section class="glass" id="protoCard" style="display:none"><div class="row"><div><div class="t">IR protocol</div><div class="d">Tap Next until your AC beeps</div></div><div class="seg" style="display:block"><button id="protoBtn" style="padding:12px 18px">AC</button></div></div></section>
  <div class="foot" id="foot"></div>
</main>

<script>
(function(){
  var S={power:true,mode:'cool',temp:24,fan:'auto',swing:false};
  var MODES=[['cool','Cool','<path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11"/>'],
    ['heat','Heat','<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'],
    ['dry','Dry','<path d="M12 3C8 9 6 12 6 15a6 6 0 0 0 12 0c0-3-2-6-6-12z"/>'],
    ['fan','Fan','<circle cx="12" cy="12" r="2"/><path d="M12 10c-1-5 1-7 3-7s2 3-3 7zM14 12c5-1 7 1 7 3s-3 2-7-3zM12 14c1 5-1 7-3 7s-2-3 3-7zM10 12c-5 1-7-1-7-3s3-2 7 3z"/>'],
    ['auto','Auto','<path d="M12 3l2.5 6 6.5.5-5 4.3 1.6 6.4L12 16.5 6.4 20.2 8 13.8 3 9.5 9.5 9z"/>']];
  var FANS=[['auto','Auto',0],['low','Low',1],['med','Medium',2],['high','High',3]];
  var $=function(i){return document.getElementById(i)};
  var modesEl=$('modes'),fansEl=$('fans'),t=$('temp');

  MODES.forEach(function(m){
    var b=document.createElement('button');b.className='chip';b.dataset.m=m[0];
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+m[2]+'</svg>'+m[1];
    b.onclick=function(){S.mode=m[0];render(true)};modesEl.appendChild(b);
  });
  FANS.forEach(function(f){
    var b=document.createElement('button');b.dataset.f=f[0];b.textContent=f[1];
    b.onclick=function(){S.fan=f[0];render(true)};fansEl.appendChild(b);
  });

  function render(send){
    document.body.dataset.mode=S.mode;
    document.body.classList.toggle('off',!S.power);
    var tv=$('tv');
    if(tv.textContent!=String(S.temp)){tv.textContent=S.temp;tv.classList.add('bump');setTimeout(function(){tv.classList.remove('bump')},180)}
    t.value=S.temp;t.style.setProperty('--p',((S.temp-16)/16*100)+'%');
    [].forEach.call(modesEl.children,function(c){c.classList.toggle('on',c.dataset.m===S.mode)});
    [].forEach.call(fansEl.children,function(c){c.classList.toggle('on',c.dataset.f===S.fan)});
    var f=FANS.filter(function(x){return x[0]===S.fan})[0];
    $('modeName').textContent=S.mode;
    $('fanName').textContent='Fan '+f[1].toLowerCase();
    var fan=$('fan');fan.setAttribute('class','fan '+(f[2]===0?'auto':'s'+f[2]));
    $('wind').className='wind l'+f[2];
    $('swing').classList.toggle('on',S.swing);$('swing').setAttribute('aria-checked',S.swing);
    $('vane').classList.toggle('sw',S.swing&&S.power);
    $('swd').textContent=S.swing?'Louver sweeping':'Louver fixed';
    if(send)transmit();
  }

  var timer;
  function transmit(){
    clearTimeout(timer);
    timer=setTimeout(function(){
      var frame=JSON.stringify(Object.assign({proto:PROTOS[pi]},S));
      try{if(window.Android&&Android.sendIr){Android.sendIr(frame);msg('Sent to IR emitter')}else{msg('Preview only: no IR emitter in a browser')}}catch(e){msg('Send failed')}
    },250);
  }
  function msg(m){var f=$('foot');f.textContent=m;f.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(function(){f.style.opacity=0},2200)}

  $('pwr').onclick=function(){S.power=!S.power;render(true)};
  $('swing').onclick=function(){S.swing=!S.swing;render(true)};
  t.addEventListener('input',function(){S.temp=+t.value;render(false);if(navigator.vibrate)try{navigator.vibrate(4)}catch(e){}});
  t.addEventListener('change',transmit);
  var fx=document.createElement('div');fx.id='fx';document.body.insertBefore(fx,document.body.children[2]);
  for(var i=0;i<18;i++){var p=document.createElement('span');p.className='pt';
    p.style.cssText='--x:'+(Math.random()*100)+'%;--y:'+(Math.random()*100)+'%;--s:'+(3+Math.random()*5)+'px;--d:'+(9+Math.random()*10)+'s;--dl:-'+(Math.random()*14)+'s';fx.appendChild(p)}
  function par(x,y){var r=document.documentElement.style;r.setProperty('--px',x+'px');r.setProperty('--py',y+'px')}
  addEventListener('pointermove',function(e){
    par((e.clientX/innerWidth-.5)*50,(e.clientY/innerHeight-.5)*50);
    [].forEach.call(document.querySelectorAll('.glass'),function(g){var r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')})});
  addEventListener('deviceorientation',function(e){if(e.gamma==null)return;
    var c=function(v){return Math.max(-30,Math.min(30,v))*1.3};par(c(e.gamma),c(e.beta-45))});
  document.addEventListener('pointerdown',function(e){var b=e.target.closest('.chip,.pwr,.seg button');if(!b)return;
    var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rp';
    s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
    b.appendChild(s);setTimeout(function(){s.remove()},700)});
  function flash(){var h=document.querySelector('.hero');h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}
  modesEl.addEventListener('click',flash);fansEl.addEventListener('click',flash);
  var PROTOS=['AC','AC1','AC264','AC344','AC424'],pi=0;
  try{pi=Math.max(0,PROTOS.indexOf(localStorage.getItem('proto')))}catch(e){}
  function showP(){$('protoBtn').textContent='Hitachi '+PROTOS[pi]+' \u00b7 Next'}
  if(window.Android){$('protoCard').style.display='';showP()}
  $('protoBtn').onclick=function(){pi=(pi+1)%PROTOS.length;try{localStorage.setItem('proto',PROTOS[pi])}catch(e){}showP();transmit()};
  var rt=document.documentElement,sv=null;try{sv=localStorage.getItem('theme')}catch(e){}
  rt.dataset.theme=sv||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  $('thm').onclick=function(){var n=rt.dataset.theme==='dark'?'light':'dark';rt.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};
  render(false);
})();
</script>
